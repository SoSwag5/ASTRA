name: CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.14', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes --only-binary=:all: -r requirements.lock.txt
      - run: python -m playwright install chromium
      - working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          npm audit --audit-level=low
      - run: python -m pytest -q
      - run: python scripts/publication_gate.py
      - name: Audit authoritative Python lock
        run: |
          python -m venv .audit-env
          .audit-env/Scripts/python -m pip install pip-audit
          .audit-env/Scripts/python -m pip_audit --disable-pip --require-hashes --strict -r requirements.lock.txt
      - name: Validate release archive
        run: python scripts/build_release.py --skip-build
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
