name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Tests + security regression (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install chromium
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Run full test suite (incl. tests/security)
        run: python -m pytest -q

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip-audit (Python advisories)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -r requirements.txt
          # Fail on any known vulnerability in the resolved dependency set.
          pip-audit --strict || (echo "::error::pip-audit found known vulnerabilities" && exit 1)
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high

  dependency-review:
    name: Dependency review (PR only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
