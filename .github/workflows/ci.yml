name: CI
'on':
  push:
    branches:
    - main
    - master
  pull_request: {}
  workflow_call: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python }}
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
    - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock.txt'
    - run: python -m playwright install chromium
    - run: 'npm ci

        if ($LASTEXITCODE) { exit $LASTEXITCODE }

        npm test

        if ($LASTEXITCODE) { exit $LASTEXITCODE }

        npm run build

        if ($LASTEXITCODE) { exit $LASTEXITCODE }

        npm audit --audit-level=low

        exit $LASTEXITCODE'
      working-directory: frontend
    - run: python -m pytest -q --junitxml=release/tests.xml
    - run: python scripts/publication_gate.py
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: tests-${{ matrix.python }}
        path: release/tests.xml
        if-no-files-found: error
      if: always()
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.13'
        - '3.14'
    env:
      PYTHONUTF8: '1'
  sca:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.13'
    - run: python -m pip install --require-hashes -r requirements-assurance.lock.txt
    - run: New-Item -ItemType Directory -Force release | Out-Null
    - run: python -m pip_audit --disable-pip --require-hashes --strict -r requirements.lock.txt --format=json --output=release/python-sca.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: python-sca
        path: release/python-sca.json
        if-no-files-found: error
      if: always()
  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
      with:
        fail-on-severity: low
    if: github.event_name == 'pull_request'
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - test
    - sca
    - codeql
    - dependency-review
    steps:
    - run: 'python - <<''PY''

        import os,json

        n=json.loads(os.environ[''RESULTS''])

        for job in (''test'',''sca'',''codeql''): assert n[job][''result'']==''success'', job

        expected=''success'' if os.environ[''EVENT'']==''pull_request'' else ''skipped''

        assert n[''dependency-review''][''result'']==expected

        PY'
      env:
        RESULTS: ${{ toJSON(needs) }}
        EVENT: ${{ github.event_name }}
    name: Security Verification
    if: always()
